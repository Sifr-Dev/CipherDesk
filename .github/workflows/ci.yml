name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout apps
        uses: actions/checkout@v4
        with:
          path: sifr-apps

      - name: Checkout framework (path dependency)
        uses: actions/checkout@v4
        with:
          repository: Sifr-Dev/Cipher
          path: sifr-native

      - name: Install fonts used by the text engine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core

      - name: Install Zig 0.17.1 (official tarball, sha256 verified)
        run: |
          curl -fsSL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz -o /tmp/zig.tar.xz
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  /tmp/zig.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"

      - name: Build apps (Debug)
        working-directory: sifr-apps
        run: zig build

      - name: Build apps (ReleaseSafe, stripped)
        working-directory: sifr-apps
        run: zig build -Doptimize=ReleaseSafe

      # The multiplexer wire contract. No display, GPU or socket needed.
      - name: Test multiplexer protocol
        working-directory: sifr-apps
        run: zig build test --summary all

      # Drives the built CLI against a real engine over a private socket.
      # Still headless: no Wayland compositor, no Vulkan device.
      - name: Test multiplexer end to end
        working-directory: sifr-apps
        run: zig build test-e2e --summary all
